services:
  mysql:
    image: mysql:8.0
    container_name: party-game-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-party_game_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_this_root_password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - party_net

  party-game-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: party-game-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-party_game_db}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-change_this_root_password}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      PARTY_PUBLIC_BASE_URL: ${PARTY_PUBLIC_BASE_URL:-http://localhost}
      PARTY_CORS_ALLOWED_ORIGINS: ${PARTY_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      PARTY_WS_ALLOWED_ORIGINS: ${PARTY_WS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      PARTY_ALLOW_PASSWORDLESS_PHONE: ${PARTY_ALLOW_PASSWORDLESS_PHONE:-false}
      PARTY_SMS_SANDBOX: ${PARTY_SMS_SANDBOX:-false}
      PARTY_PAYMENT_SANDBOX: ${PARTY_PAYMENT_SANDBOX:-false}
      PARTY_ADMIN_PASSWORD_HASH: ${PARTY_ADMIN_PASSWORD_HASH:-}
      PARTY_ADMIN_PASSWORD: ${PARTY_ADMIN_PASSWORD:-}
      PARTY_ADMIN_USERNAMES: ${PARTY_ADMIN_USERNAMES:-admin}
    ports:
      - "9001:9001"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - party_net

  nginx:
    image: nginx:1.27-alpine
    container_name: party-game-nginx
    restart: unless-stopped
    depends_on:
      - party-game-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    networks:
      - party_net

volumes:
  mysql_data:

networks:
  party_net:
    driver: bridge
