name: Build Multi-Platform Apps (Android, iOS, Web, Windows & Server)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 0. Resolve Version & Static/Unit Checks
  # ============================================================================
  prepare-metadata:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Extract Version from pubspec.yaml
        id: ver
        run: |
          RAW_VER=$(grep -E '^version:' party_game_app/pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f1)
          echo "version=${RAW_VER:-1.0.56}" >> "$GITHUB_OUTPUT"
          echo "Resolved app version: ${RAW_VER:-1.0.56}"

  # ============================================================================
  # 1. Android Client (.apk & .aab)
  # ============================================================================
  build-android:
    name: Android Client (.apk / .aab)
    needs: prepare-metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.x'
          cache: true

      - name: Decode & Validate Release Keystore (Fail-Fast)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing PartyGame Android release signing secrets!"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > "${{ runner.temp }}/party_game-release.jks"
          chmod 600 "${{ runner.temp }}/party_game-release.jks"

      - name: Flutter Pub Get & Analyze
        run: |
          set -o pipefail
          cd party_game_app
          chmod +x android/gradlew
          flutter pub get
          if ! flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.log; then
            (grep -iE 'error' /tmp/analyze.log || true) | head -n 6 | while IFS= read -r line; do
              echo "::error title=Flutter Analyze::${line}"
            done
            tail -n 4 /tmp/analyze.log | while IFS= read -r line; do
              echo "::error title=Flutter Analyze Tail::${line}"
            done
            exit 1
          fi

      - name: Build Android Release APK
        env:
          PARTY_GAME_KEYSTORE_FILE: ${{ runner.temp }}/party_game-release.jks
          PARTY_GAME_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PARTY_GAME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PARTY_GAME_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          cd party_game_app
          if ! flutter build apk --release 2>&1 | tee /tmp/apk.log; then
            grep -E '(ERROR:|FAILURE:|Exception:|e:|What went wrong|Build failed|error:)' /tmp/apk.log | head -n 6 | while IFS= read -r line; do
              echo "::error title=Android APK::${line}"
            done
            tail -n 6 /tmp/apk.log | while IFS= read -r line; do
              echo "::error title=Android APK Tail::${line}"
            done
            exit 1
          fi

      - name: Build Android Release AAB
        env:
          PARTY_GAME_KEYSTORE_FILE: ${{ runner.temp }}/party_game-release.jks
          PARTY_GAME_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PARTY_GAME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PARTY_GAME_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          cd party_game_app
          if ! flutter build appbundle --release 2>&1 | tee /tmp/aab.log; then
            grep -E '(ERROR:|FAILURE:|Exception:|e:|What went wrong|Build failed|error:)' /tmp/aab.log | head -n 6 | while IFS= read -r line; do
              echo "::error title=Android AAB::${line}"
            done
            tail -n 6 /tmp/aab.log | while IFS= read -r line; do
              echo "::error title=Android AAB Tail::${line}"
            done
            exit 1
          fi

      - name: Verify Release APK Signature
        run: |
          CERT_OUT=$(keytool -printcert -jarfile party_game_app/build/app/outputs/flutter-apk/app-release.apk)
          echo "$CERT_OUT"
          if echo "$CERT_OUT" | grep -qi "Android Debug"; then
            echo "::error::APK is signed with Android Debug certificate!"
            exit 1
          fi
          EXPECTED_SHA256="57:23:10:82:59:0C:65:3F:E6:FF:9D:47:55:6E:FA:EE:8F:87:80:72:8C:DF:99:8F:79:63:2C:6C:BD:4C:F4:18"
          if ! echo "$CERT_OUT" | grep -qi "$EXPECTED_SHA256"; then
            echo "::error::APK SHA-256 fingerprint does not match expected release certificate ($EXPECTED_SHA256)!"
            exit 1
          fi

      - name: Clean Up Temporary Android Keystore
        if: always()
        run: |
          rm -f "${{ runner.temp }}/party_game-release.jks" \
                party_game_app/android/key.properties \
                party_game_app/android/app/upload-keystore.jks

      - name: Stage Android Release Files
        env:
          VER: ${{ needs.prepare-metadata.outputs.app_version }}
        run: |
          mkdir -p release_out
          cp party_game_app/build/app/outputs/flutter-apk/app-release.apk "release_out/party-game-v${VER}-android-universal.apk"
          cp party_game_app/build/app/outputs/bundle/release/app-release.aab "release_out/party-game-v${VER}-android-bundle.aab"
          ls -lh release_out/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PartyGame-Android-APK-AAB
          path: |
            release_out/*-android-universal.apk
            release_out/*-android-bundle.aab

  # ============================================================================
  # 2. iOS Client (.ipa)
  # ============================================================================
  build-ios:
    name: iOS Client (.ipa)
    needs: prepare-metadata
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.x'
          cache: true

      - name: Build iOS Release App & Package Unsigned IPA
        env:
          VER: ${{ needs.prepare-metadata.outputs.app_version }}
        run: |
          cd party_game_app
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa_stage/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa_stage/Payload/
          mkdir -p ../release_out
          cd build/ios/ipa_stage
          zip -qry "../../../../release_out/party-game-v${VER}-ios-unsigned.ipa" Payload
          ls -lh ../../../../release_out/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PartyGame-iOS-IPA
          path: release_out/*-ios-unsigned.ipa

  # ============================================================================
  # 3. Web Client (H5) & Java Backend Server (.jar)
  # ============================================================================
  build-web-and-backend:
    name: Web H5 Client & Java Server (.jar)
    needs: prepare-metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.x'
          cache: true

      - name: Flutter Pub Get & Analyze
        run: |
          set -o pipefail
          cd party_game_app
          flutter pub get
          if ! flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze_web.log; then
            (grep -iE 'error' /tmp/analyze_web.log || true) | head -n 6 | while IFS= read -r line; do
              echo "::error title=Flutter Analyze::${line}"
            done
            tail -n 4 /tmp/analyze_web.log | while IFS= read -r line; do
              echo "::error title=Flutter Analyze Tail::${line}"
            done
            exit 1
          fi

      - name: Build Web H5 Bundle
        env:
          VER: ${{ needs.prepare-metadata.outputs.app_version }}
        run: |
          set -o pipefail
          mkdir -p release_out
          cd party_game_app
          if ! flutter build web --release 2>&1 | tee /tmp/web.log; then
            grep -E '(Error:|FAILURE:|Exception|Target dart2js failed)' /tmp/web.log | head -n 6 | while IFS= read -r line; do
              echo "::error title=Web Build::${line}"
            done
            tail -n 6 /tmp/web.log | while IFS= read -r line; do
              echo "::error title=Web Build Tail::${line}"
            done
            exit 1
          fi
          (cd build/web && zip -qry "../../../release_out/party-game-v${VER}-web-h5.zip" .)

      - name: Run Java Unit Tests
        run: |
          set -o pipefail
          cd party_game_server_java
          if ! mvn -B test 2>&1 | tee /tmp/mvn_test.log; then
            grep -E '(\[ERROR\]|FAILURE!|Errors:|Tests run:)' /tmp/mvn_test.log | head -n 8 | while IFS= read -r line; do
              echo "::error title=Maven Test::${line}"
            done
            tail -n 6 /tmp/mvn_test.log | while IFS= read -r line; do
              echo "::error title=Maven Test Tail::${line}"
            done
            exit 1
          fi

      - name: Package Java Spring Boot Server
        run: |
          set -o pipefail
          mkdir -p release_out
          cd party_game_server_java
          if ! mvn -B clean package -DskipTests 2>&1 | tee /tmp/mvn_pkg.log; then
            grep -E '(\[ERROR\]|COMPILATION ERROR)' /tmp/mvn_pkg.log | head -n 8 | while IFS= read -r line; do
              echo "::error title=Maven Package::${line}"
            done
            exit 1
          fi
          cp target/party-game-server-1.0.0.jar ../release_out/party-game-server-1.0.0.jar
          ls -lh ../release_out/

      - name: Upload Web & Backend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PartyGame-Web-and-Server
          path: |
            release_out/*-web-h5.zip
            release_out/party-game-server-1.0.0.jar

  # ============================================================================
  # 4. Windows Desktop Client (.exe bundle)
  # ============================================================================
  build-windows:
    name: Windows Desktop Client (.zip)
    needs: prepare-metadata
    runs-on: windows-2022
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.x'
          cache: true

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Flutter Pub Get
        shell: pwsh
        run: |
          Set-Location party_game_app
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows Release Client
        shell: pwsh
        env:
          VER: ${{ needs.prepare-metadata.outputs.app_version }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path release_out | Out-Null
          Set-Location party_game_app
          $winBuildNum = ($env:VER -split '\.')[-1]
          if ([string]::IsNullOrWhiteSpace($winBuildNum) -or ($winBuildNum -notmatch '^\d+$')) { $winBuildNum = '57' }
          $out = flutter build windows --release --build-name="$($env:VER)" --build-number="$winBuildNum" 2>&1
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            $lines = @($out | ForEach-Object { "$_" })
            $cmakeIdx = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'CMake Error|error [A-Z]{1,4}\d+|NuGet') { $cmakeIdx = $i; break }
            }
            if ($cmakeIdx -ge 0) {
              $endIdx = [Math]::Min($lines.Count - 1, $cmakeIdx + 6)
              for ($j = $cmakeIdx; $j -le $endIdx; $j++) {
                Write-Host "::error title=Windows Build::$($lines[$j])"
              }
            } else {
              ($lines | Select-Object -Last 6) | ForEach-Object {
                Write-Host "::error title=Windows Build Tail::$_"
              }
            }
            exit $LASTEXITCODE
          }
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "../release_out/party-game-v$($env:VER)-windows-x64.zip" -Force
          Get-ChildItem ../release_out

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PartyGame-Windows-x64
          path: release_out/*-windows-x64.zip

  # ============================================================================
  # 5. Publish GitHub Release Assets
  # ============================================================================
  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [prepare-metadata, build-android, build-ios, build-web-and-backend, build-windows]
    if: ${{ always() && needs.prepare-metadata.result == 'success' && (needs.build-android.result == 'success' || needs.build-web-and-backend.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Flat Release Files & SHA-256 Checksums
        run: |
          mkdir -p release_files
          if [ -d artifacts ]; then
            find artifacts -type f -exec cp {} release_files/ \;
          fi
          if [ -z "$(ls -A release_files)" ]; then
            echo "Error: no build artifacts found for release!"
            exit 1
          fi
          cd release_files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          VER: ${{ needs.prepare-metadata.outputs.app_version }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.prepare-metadata.outputs.app_version) }}
          name: "聚会桌游吧 PartyGame Club v${{ needs.prepare-metadata.outputs.app_version }} (Multi-Platform Release)"
          body: |
            ## 🎲 聚会桌游吧 (PartyGame Club) v${{ needs.prepare-metadata.outputs.app_version }} 全平台构建发行包
            - **📱 Android 移动端 (APK / AAB)** (`${{ needs.build-android.result }}`): `party-game-v${{ needs.prepare-metadata.outputs.app_version }}-android-universal.apk` / `party-game-v${{ needs.prepare-metadata.outputs.app_version }}-android-bundle.aab`
            - **🍎 iOS 移动端 (未签名 IPA)** (`${{ needs.build-ios.result }}`): `party-game-v${{ needs.prepare-metadata.outputs.app_version }}-ios-unsigned.ipa`
            - **💻 Windows 桌面客户端 (x64 绿色版)** (`${{ needs.build-windows.result }}`): `party-game-v${{ needs.prepare-metadata.outputs.app_version }}-windows-x64.zip`
            - **🌐 Web H5 & ☕ Java 联机服务端** (`${{ needs.build-web-and-backend.result }}`): `party-game-v${{ needs.prepare-metadata.outputs.app_version }}-web-h5.zip` / `party-game-server-1.0.0.jar`
            - **🔒 SHA-256 完整性校验清单**: `SHA256SUMS.txt`
          files: release_files/*
          draft: false
          prerelease: false
